name: Build and Release

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-common-tests:
    name: .NET common tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Test Core
        run: dotnet test tests-dotnet/RatioGhost.Core.Tests/RatioGhost.Core.Tests.csproj --configuration Release

      - name: Test Proxy
        run: dotnet test tests-dotnet/RatioGhost.Proxy.Tests/RatioGhost.Proxy.Tests.csproj --configuration Release

      - name: Audit NuGet dependencies
        run: dotnet list RatioGhost.slnx package --vulnerable --include-transitive

  dotnet-windows-package:
    name: .NET Windows x64 package
    runs-on: windows-latest
    needs:
      - dotnet-common-tests
      - dotnet-desktop-builds

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Package win-x64
        shell: pwsh
        run: ./scripts/package-win-x64.ps1

      - name: Smoke published Windows application
        shell: pwsh
        run: ./scripts/smoke-win-x64.ps1

      - name: Verify .NET Windows package checksums and entries
        shell: pwsh
        run: |
          $exe = '.\artifacts\win-x64\RatioGhost.exe'
          $exeHashFile = '.\artifacts\win-x64\RatioGhost.exe.sha256'
          $actualExeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $declaredExeHash = ((Get-Content $exeHashFile -Raw).Trim() -split '\s+')[0].ToLower()
          if ($actualExeHash -ne $declaredExeHash) {
            throw "Published EXE checksum mismatch: expected $declaredExeHash, got $actualExeHash."
          }
          $archive = '.\artifacts\RatioGhost-dotnet-win-x64.zip'
          $archiveHashFile = "$archive.sha256"
          $actualArchiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $declaredArchiveHash = ((Get-Content $archiveHashFile -Raw).Trim() -split '\s+')[0].ToLower()
          if ($actualArchiveHash -ne $declaredArchiveHash) {
            throw "Published ZIP checksum mismatch: expected $declaredArchiveHash, got $actualArchiveHash."
          }
          $entries = @(tar -tf $archive)
          if (($entries -notcontains 'RatioGhost.exe') -or ($entries -notcontains 'RatioGhost.exe.sha256')) {
            throw "Published ZIP entries are incomplete: $($entries -join ', ')."
          }

      - name: Upload .NET Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratioghost-dotnet-win-x64
          path: |
            artifacts/win-x64/RatioGhost.exe
            artifacts/win-x64/RatioGhost.exe.sha256
            artifacts/RatioGhost-dotnet-win-x64.zip
            artifacts/RatioGhost-dotnet-win-x64.zip.sha256
          if-no-files-found: error

  dotnet-desktop-builds:
    name: .NET desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Test Avalonia desktop and platform boundary
        run: dotnet test tests-dotnet/RatioGhost.Desktop.Tests/RatioGhost.Desktop.Tests.csproj --configuration Release

      - name: Compile Avalonia desktop for target RID
        run: dotnet build src/RatioGhost.Desktop/RatioGhost.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Verify attended trust test is opt-in
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RATIOGHOST_RUN_ATTENDED_TRUST_TEST: ''
          RATIOGHOST_ATTENDED_PROFILE: ''
        run: dotnet test tests-dotnet/RatioGhost.Desktop.Tests/RatioGhost.Desktop.Tests.csproj --configuration Release --filter 'FullyQualifiedName~TrustRoundTrip_CurrentUserRootStore'

  build:
    name: Build & Release Executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Release Version
        shell: pwsh
        run: |
          $version = (Get-Content .\rghost.vfs\VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid semantic version: $version"
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag v$tagVersion does not match rghost.vfs/VERSION ($version)."
            }
          }

      - name: Bundle Trusted Certificate Authorities
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt',
            'C:\Program Files\Git\usr\ssl\certs\ca-bundle.crt'
          )
          $caBundle = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$caBundle) {
            throw 'The Git for Windows CA bundle was not found.'
          }
          Copy-Item $caBundle .\rghost.vfs\tls\cacert.pem

      - name: Run Tests
        shell: pwsh
        run: |
          .\tclkitsh.exe tests\all.tcl

      - name: Build Standalone EXE
        shell: pwsh
        run: |
          .\tclkitsh.exe sdx.kit wrap ratioghost.exe -runtime .\tclkit.exe -vfs rghost.vfs

      - name: Smoke Standalone EXE
        shell: pwsh
        run: |
          function Reserve-LoopbackPortPair {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $first = [System.Net.Sockets.TcpListener]::new(
                [System.Net.IPAddress]::Loopback,
                0)
              $second = $null
              try {
                $first.Start()
                $port = ([System.Net.IPEndPoint]$first.LocalEndpoint).Port
                if ($port -ge 65534) {
                  $first.Stop()
                  continue
                }
                $second = [System.Net.Sockets.TcpListener]::new(
                  [System.Net.IPAddress]::Loopback,
                  ($port + 1))
                $second.Start()
                return [pscustomobject]@{
                  Port = $port
                  First = $first
                  Second = $second
                }
              } catch {
                $first.Stop()
                if ($null -ne $second) {
                  $second.Stop()
                }
              }
            }
            throw 'Could not reserve adjacent loopback ports for the Tcl smoke test.'
          }

          $env:APPDATA = Join-Path $pwd 'ci-appdata'
          $env:RATIOGHOST_ISOLATED_TEST = '1'
          $portPair = Reserve-LoopbackPortPair
          $listenPort = $portPair.Port
          $env:RATIOGHOST_LISTEN_PORT = [string]$listenPort
          $portPair.First.Stop()
          $portPair.Second.Stop()
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          $process = Start-Process -FilePath .\ratioghost.exe -ArgumentList 'm' -PassThru
          try {
            $listening = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Milliseconds 500
              $ports = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
                Where-Object { $_.OwningProcess -eq $process.Id -and ($_.LocalPort -eq $listenPort -or $_.LocalPort -eq ($listenPort + 1)) }
              $openPorts = @($ports | Select-Object -ExpandProperty LocalPort -Unique)
              if (($openPorts -contains $listenPort) -and ($openPorts -contains ($listenPort + 1))) {
                $listening = $true
                break
              }
              if ($process.HasExited) {
                throw "RatioGhost exited during smoke test with code $($process.ExitCode)."
              }
            }
            if (!$listening) {
              throw "RatioGhost did not open expected ports $listenPort and $($listenPort + 1)."
            }
            $version = (Get-Content .\rghost.vfs\VERSION -Raw).Trim()
            if ($version -eq '0.19') {
              throw 'The obsolete application version is still packaged.'
            }
            $bgerror = Join-Path $env:APPDATA 'RatioGhost\bgerror.txt'
            if ((Test-Path $bgerror) -and (Get-Item $bgerror).Length -gt 0) {
              Get-Content $bgerror
              throw "RatioGhost wrote bgerror.txt during smoke test."
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Verify Build and Create Checksum
        shell: pwsh
        run: |
          if (!(Test-Path .\ratioghost.exe) -or (Get-Item .\ratioghost.exe).Length -lt 1000000) {
            throw "Standalone executable was not built correctly."
          }
          (Get-FileHash .\ratioghost.exe -Algorithm SHA256).Hash.ToLower() + "  ratioghost.exe" |
            Set-Content -Encoding ascii .\ratioghost.exe.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratioghost-windows
          path: |
            ratioghost.exe
            ratioghost.exe.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: windows-latest
    needs:
      - build
      - dotnet-windows-package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ratioghost-windows
          path: .

      - name: Download .NET Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ratioghost-dotnet-win-x64
          path: dotnet-package

      - name: Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ratioghost.exe
            ratioghost.exe.sha256
            dotnet-package/RatioGhost-dotnet-win-x64.zip
            dotnet-package/RatioGhost-dotnet-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
